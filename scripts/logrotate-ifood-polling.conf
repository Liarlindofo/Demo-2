# /etc/logrotate.d/ifood-polling
#
# Para instalar na VPS:
#   sudo cp /usr/local/bin/logrotate-ifood-polling.conf /etc/logrotate.d/ifood-polling
#   sudo logrotate -d /etc/logrotate.d/ifood-polling   # dry-run (verificar)
#   sudo logrotate -f /etc/logrotate.d/ifood-polling   # forçar rotação agora
#
/var/log/ifood-polling.log {
    daily                  # rotaciona todo dia
    rotate 7               # mantém 7 arquivos (7 dias de histórico)
    compress               # gzip nos arquivos antigos
    delaycompress          # comprime somente na próxima rotação (deixa ontem legível)
    missingok              # não dá erro se o arquivo ainda não existir
    notifempty             # não rotaciona se o log estiver vazio
    create 0644 root root  # recria o arquivo com essas permissões
    dateext                # sufixo com data (ex: ifood-polling.log-20260905)
}
